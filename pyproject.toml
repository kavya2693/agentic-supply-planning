[project]
name = "supply-planning"
version = "0.1.0"
description = "Demand forecast turned into budgeted, approved purchase orders by a supervisor and four LangGraph agents"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2",
    "langchain-openai>=0.3",
    "lightgbm>=4.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.scripts]
supply-planning = "supply_planning.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supply_planning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# X, Y, P follow the usual matrix notation for features, demand and promotions.
"src/supply_planning/forecast.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
