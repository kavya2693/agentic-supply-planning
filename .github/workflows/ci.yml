name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy

      # No model is called: the workflow tests stub the briefing model, and every
      # order decision is deterministic, so the suite needs no API key.
      - name: tests
        run: uv run pytest -q

      - name: end-to-end planning cycle
        run: uv run supply-planning --refresh
